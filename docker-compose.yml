secrets:
  litellm_api_key:
    file: local/litellm_api_key
  confluence_token:
    file: local/confluence_token
  chainlit_auth_secret:
    file: local/chainlit_auth_secret

services:
  chainlit:
    hostname: boba-chainlit
    image: boba-chainlit:latest
    build:
      context: ..
      dockerfile: boba-artifacts/Dockerfile
    environment:
      BOBA_CONFIG: /app/config/config.toml
      LITELLM_API_KEY_FILE: /run/secrets/litellm_api_key
      WORKSPACE_BASE_DIR: /app/workspaces
      LOG_FILE: /app/logs/chainlit.log
    volumes:
      - ./local/boba-config.toml:/app/config/config.toml:ro
      - ./local/chainlit-config.toml:/app/chainlit/.chainlit/config.toml:ro
      - chainlit-workspaces:/app/workspaces
      - chainlit-logs:/app/logs
    secrets:
      - litellm_api_key
      - chainlit_auth_secret
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/boba/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

volumes:
  chainlit-workspaces:
  chainlit-logs:

networks:
  default:
    name: docker
    external: true
