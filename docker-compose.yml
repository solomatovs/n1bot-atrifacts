x-boba-base: &boba-base
  # Рантайм всегда гоняет последний собранный образ; версионный тег
  # boba:tools-X.Y.Z навешивается дополнительно через build.tags (см. Makefile).
  image: boba:latest
  build:
    context: ..
    dockerfile: boba-artifacts/Dockerfile
    tags:
      - boba:tools-${BOBA_TAG:-0.0.1}
  env_file:
    - ./local/.env
  volumes:
    # Bind mount всей папки local/ — единая deployment-песочница.
    # Сохраняется на хосте:
    #   /app/local/config.toml   — настройки
    #   /app/local/prompts/      — system-prompts
    #   /app/local/workspaces/   — workspaces сессий (chainlit UUID / cli user/system)
    #   /app/local/chainlit/     — chainlit runtime-state
    #   /app/local/logs/         — логи сервисов
    #   /app/local/cache/        — runtime-кэши (fastembed ONNX-веса,
    #                              переносимые offline на другой хост)
    #   /app/local/docs/         — KbDoc-input для confluence_doc
    #   /app/local/downloads/    — output confluence.download / input для confluence.ingest
    - ./local:/app/local

services:
  chainlit:
    <<: *boba-base
    hostname: boba-chainlit
    entrypoint: ["boba-chainlit-agent"]
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      # Chainlit отдаёт /health под своим url_prefix (CHAINLIT_ROOT_PATH).
      # Префикс берём из той же настройки, что и приложение; пусто = корень.
      # Если url_prefix задан только в config.toml — продублируй его в .env.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501${BOBA_CHAINLIT__URL_PREFIX:-}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

  # Ad-hoc CLI: ``docker compose run --rm -T cli-agent --cli.agent.model X --cli.agent.query "..."``.
  # Без --cli.agent.query запускается REPL — :q/exit/quit для выхода, /clear для сброса.
  cli-agent:
    <<: *boba-base
    profiles: ["cli"]
    entrypoint: ["boba-cli-agent"]

networks:
  default:
    name: docker
    external: true
