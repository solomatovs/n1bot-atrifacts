services:
  chainlit:
    hostname: boba-chainlit
    image: boba-chainlit:latest
    build:
      context: ..
      dockerfile: boba-artifacts/Dockerfile
    env_file:
      - ./local/env.secrets
      - ./local/env.tunables
    volumes:
      - chainlit-workspaces:/app/workspaces
      - chainlit-logs:/app/logs
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8501/boba/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

volumes:
  chainlit-workspaces:
  chainlit-logs:

networks:
  default:
    name: docker
    external: true
