x-boba-base: &boba-base
  image: boba:${BOBA_TAG:-latest}
  build:
    context: ..
    dockerfile: boba-artifacts/Dockerfile
    tags:
      - boba:latest
  env_file:
    - ./local/.env
  volumes:
    # Bind mount всей папки local/ — единая песочница
    # Сохраняется на хосте:
    #   /app/local/config.toml   — настройки
    #   /app/local/prompts/      — system-prompts
    #   /app/local/workspaces/   — workspaces сессий (chainlit UUID / cli user/system)
    #   /app/local/chainlit/     — chainlit runtime-state
    #   /app/local/logs/         — логи сервисов
    #   /app/local/cache/        — runtime-кэши (fastembed ONNX-веса,
    #                              переносимые offline на другой хост)
    #   /app/local/docs/         — KbDoc-input для confluence_doc
    #   /app/local/downloads/    — output confluence.download / input для confluence.ingest
    - ./local:/app/local

services:
  chainlit:
    <<: *boba-base
    hostname: boba-chainlit
    entrypoint: ["boba-chainlit"]
    expose:
      - "8501"
    ports:
      - 127.0.0.1:8501:8501
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501${CHAINLIT_URL_PREFIX:-/boba}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - boba-chainlit
    restart: unless-stopped

  # cli agent
  cli-agent:
    <<: *boba-base
    profiles: ["cli"]
    entrypoint: ["boba-cli"]

  # [cli.kb.bootstrap] — накатывает миграции (схема таблиц)
  kb-bootstrap:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.kb_bootstrap"]


  # [cli.kb.confluence.ingest] — индексация страниц Confluence по HTTP в KB
  kb-confluence-ingest:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence.ingest"]


  # [cli.kb.confluence_doc.ingest] — индексация заранее подготовленных md-файлов
  kb-confluence-doc-ingest:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence_doc"]


  # [cli.kb.confluence.download] — скачивание страниц Confluence на ФС
  kb-confluence-download:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.confluence.download"]


  # [cli.kb.search.render] — рендер SQL поискового запроса к KB (без LLM)
  kb-search-render:
    <<: *boba-base
    profiles: ["kb"]
    entrypoint: ["python3", "-m", "boba.tool.kb.cli.search"]

networks:
  default:
    name: docker
    external: true
